<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The page only ever talks to its own origin (scripts, WASM, model files):
    no analytics, no fonts or scripts from a CDN, and no request can carry the
    text anywhere else.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Anonymize text before sending it to an AI chat, and restore the original values in the reply. Runs entirely in your browser.">
  <title>Privacy Guardrail — Anonymize &amp; restore</title>
  <link rel="icon" href="icon128.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f172a">
</head>
<body>
  <div id="app"></div>
  <p class="pg-web-note">
    Runs entirely in this browser: detection uses WebAssembly and a local AI model downloaded from this site,
    and History is kept in this browser's local storage — nothing is uploaded or stored on a server.
    Clear it any time from <em>History &amp; restore</em>.
    <a href="https://github.com/HunKonTech/pii-guardrail-browser-extension" rel="noopener noreferrer">Source code</a>
  </p>
  <p class="pg-web-note pg-web-offline">
    <span id="pg-offline-status"></span>
    <button type="button" id="pg-offline-model" hidden>Save the local AI model for offline use</button>
  </p>
</body>
</html>
